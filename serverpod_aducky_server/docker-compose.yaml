services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: serverpod_aducky
      POSTGRES_PASSWORD: "6-qmn3zPXowOEU1NmWXDnqic4LSTnEBV"
    volumes:
      - serverpod_aducky_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "dPA33_9sqFM2MMqzUzp6M_W22ZAIqcjx"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: serverpod_aducky_test
      POSTGRES_PASSWORD: "4sAhHEyBXnOY_i7sLSev-iHbZjCYH7vJ"
    volumes:
      - serverpod_aducky_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "ktbVwt2uQUHTsqDzV3sEPRLNqXJrRpLF"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  serverpod_aducky_data:
  serverpod_aducky_test_data:
